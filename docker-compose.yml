services:
  solidworkstoweb:
    build:
      context: https://github.com/kermitine/SolidworksToWeb.git#main
    image: solidworkstoweb:latest
    pull_policy: build
    ports:
      - "8000:8000"
    environment:
      SWTOWEB_OUTPUT_DIR: /app/output
      SWTOWEB_MAX_UPLOAD_MB: "512"
      SWTOWEB_RETENTION_HOURS: "24"
      SWTOWEB_CLEANUP_INTERVAL_MINUTES: "30"
      SWTOWEB_MAX_ACTIVE_JOBS: "1"
      SWTOWEB_FRAME_ANCESTORS: "'self' https://ayriknabirahni.com https://www.ayriknabirahni.com"
    volumes:
      - ./output:/app/output
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
